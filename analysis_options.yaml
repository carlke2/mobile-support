# Analyzer options for the Boardroom Flutter app.
# https://dart.dev/guides/language/analysis-options

include: package:flutter_lints/flutter.yaml

analyzer:
  language:
    strict-casts: true
    strict-inference: true
  exclude:
    - build/**
    - android/**
    - ios/**
  errors:
    # json_serializable / freezed field annotations are valid on constructor params.
    invalid_annotation_target: ignore

linter:
  rules:
    # avoid_print: false
    # prefer_single_quotes: true
